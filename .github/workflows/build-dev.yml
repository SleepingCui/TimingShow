name: Development Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        type: string
        default: "master"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout TimingShow
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Checkout private libraries
        uses: actions/checkout@v4
        with:
          repository: SleepingCui/adofai-libs
          ref: main
          token: ${{ secrets.ADOFAI_LIBS_TOKEN }}
          path: libs

      - name: Prepare CI version
        id: version
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $shortHash = $commit.Substring(0, 6)
          $branch = "${{ inputs.branch }}"
          $safeBranch = $branch -replace '[^A-Za-z0-9._-]', '-'
          $version = "CI-$safeBranch-$shortHash"

          "version=$version" >> $env:GITHUB_OUTPUT

          $assemblyInfo = "TimingShow.Loader.Melon/Properties/AssemblyInfo.cs"
          if (-not (Test-Path $assemblyInfo)) {
            throw "Missing file: $assemblyInfo"
          }

          $source = Get-Content $assemblyInfo -Raw
          $pattern = '(MelonInfo\(typeof\(TimingShow\.Melon\.MelonEntry\),\s*"TimingShow",\s*")[^"]+(")'
          $updated = [regex]::Replace(
            $source,
            $pattern,
            [System.Text.RegularExpressions.MatchEvaluator]{
              param($match)
              return $match.Groups[1].Value + $version + $match.Groups[2].Value
            }
          )
          if ($updated -eq $source) {
            throw "Could not update the MelonInfo version in $assemblyInfo"
          }
          Set-Content -Path $assemblyInfo -Value $updated -Encoding utf8

          $infoPath = "TimingShow.Loader.UMM/Info.json"
          if (-not (Test-Path $infoPath)) {
            throw "Missing file: $infoPath"
          }

          $info = Get-Content $infoPath -Raw | ConvertFrom-Json
          $info.Version = $version
          $info | ConvertTo-Json -Depth 100 | Set-Content -Path $infoPath -Encoding utf8

          Write-Host "Building version: $version"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TimingShow
        shell: pwsh
        run: msbuild TimingShow/TimingShow.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Build updater
        shell: pwsh
        run: msbuild TimingShow.Updater/TimingShow.Updater.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Build UMM loader
        shell: pwsh
        run: msbuild TimingShow.Loader.UMM/TimingShow.Loader.UMM.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Build MelonLoader loader
        shell: pwsh
        run: msbuild TimingShow.Loader.Melon/TimingShow.Loader.Melon.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Build update bootstrap
        shell: pwsh
        run: msbuild TimingShow.UpdateBootstrap/TimingShow.UpdateBootstrap.csproj /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Prepare artifact packages
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dist = Join-Path $env:RUNNER_TEMP "TimingShow-CI-$version"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Add-Type -AssemblyName System.IO.Compression

          $packages = @(
            @{
              Name = "TimingShow.UMM"
              Files = @(
                @{ Source = "TimingShow/bin/Release/TimingShow.dll"; Destination = "TimingShow.dll" },
                @{ Source = "TimingShow.Updater/bin/Release/TimingShow.Updater.dll"; Destination = "TimingShow.Updater.dll" },
                @{ Source = "TimingShow.Loader.UMM/bin/Release/TimingShow.Loader.UMM.dll"; Destination = "TimingShow.Loader.UMM.dll" },
                @{ Source = "TimingShow.Loader.UMM/bin/Release/Info.json"; Destination = "Info.json" },
                @{ Source = "TimingShow/bin/Release/lang.json"; Destination = "lang.json" }
              )
            },
            @{
              Name = "TimingShow.Melon"
              Files = @(
                @{ Source = "TimingShow/bin/Release/TimingShow.dll"; Destination = "Mods/TimingShow.dll" },
                @{ Source = "TimingShow.Updater/bin/Release/TimingShow.Updater.dll"; Destination = "Mods/TimingShow.Updater.dll" },
                @{ Source = "TimingShow.Loader.Melon/bin/Release/TimingShow.Loader.Melon.dll"; Destination = "Mods/TimingShow.Loader.Melon.dll" },
                @{ Source = "TimingShow/bin/Release/lang.json"; Destination = "Mods/lang.json" },
                @{ Source = "TimingShow.UpdateBootstrap/bin/Release/TimingShow.UpdateBootstrap.dll"; Destination = "Plugins/TimingShow.UpdateBootstrap.dll" }
              )
            }
          )

          foreach ($package in $packages) {
            $archivePath = Join-Path $dist "$($package.Name).zip"
            if (Test-Path $archivePath) {
              Remove-Item -LiteralPath $archivePath -Force
            }

            $archive = [System.IO.Compression.ZipFile]::Open($archivePath, "Create")
            try {
              foreach ($file in $package.Files) {
                if (-not (Test-Path $file.Source -PathType Leaf)) {
                  throw "Build output not found: $($file.Source)"
                }
                [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, (Resolve-Path $file.Source).ProviderPath, $file.Destination)
              }
            }
            finally {
              $archive.Dispose()
            }
          }

          $packagedInfo = Get-Content "TimingShow.Loader.UMM/bin/Release/Info.json" -Raw | ConvertFrom-Json
          if ($packagedInfo.Version -ne $version) {
            throw "Info.json version mismatch: $($packagedInfo.Version)"
          }

          "stage=$dist" >> $env:GITHUB_OUTPUT
          Get-ChildItem $dist | Select-Object Name, Length

      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: TimingShow-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.stage }}/*.zip
          if-no-files-found: error
          retention-days: 14
