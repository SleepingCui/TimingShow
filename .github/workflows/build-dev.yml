name: Development Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        type: string
        default: "master"

permissions:
  contents: read

env:
  PREVIEW_REPOSITORY: SleepingCui/ts_ci
  PREVIEW_BRANCH: main
  PREVIEW_COMMIT_NAME: github-actions[bot]
  PREVIEW_COMMIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

concurrency:
  group: development-build-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout TimingShow
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Checkout private libraries
        uses: actions/checkout@v4
        with:
          repository: SleepingCui/adofai-libs
          ref: main
          token: ${{ secrets.ADOFAI_LIBS_TOKEN }}
          path: libs

      - name: Prepare preview version
        id: version
        shell: pwsh
        run: |
          $infoPath = "TimingShow.Loader.UMM/Info.json"
          if (-not (Test-Path $infoPath)) {
            throw "Missing file: $infoPath"
          }

          $info = Get-Content $infoPath -Raw | ConvertFrom-Json
          $match = [regex]::Match([string]$info.Version, '^(\d+)\.(\d+)\.(\d+)')
          if (-not $match.Success) {
            throw "Info.json version must start with major.minor.patch: $($info.Version)"
          }

          $version = "$($match.Value).$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT

          $assemblyInfo = "TimingShow.Loader.Melon/Properties/AssemblyInfo.cs"
          if (-not (Test-Path $assemblyInfo)) {
            throw "Missing file: $assemblyInfo"
          }

          $source = Get-Content $assemblyInfo -Raw
          $pattern = '(MelonInfo\(typeof\(TimingShow\.Melon\.MelonEntry\),\s*"TimingShow",\s*")[^"]+(")'
          $updated = [regex]::Replace(
            $source,
            $pattern,
            [System.Text.RegularExpressions.MatchEvaluator]{
              param($match)
              return $match.Groups[1].Value + $version + $match.Groups[2].Value
            }
          )
          if ($updated -eq $source) {
            throw "Could not update the MelonInfo version in $assemblyInfo"
          }
          Set-Content -Path $assemblyInfo -Value $updated -Encoding utf8

          $info.Version = $version
          $info | ConvertTo-Json -Depth 100 | Set-Content -Path $infoPath -Encoding utf8

          Write-Host "Building version: $version"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: pwsh
        run: msbuild TimingShow.slnx /m /p:Configuration=Release /p:Platform="Any CPU"

      - name: Prepare artifact packages
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dist = Join-Path $env:RUNNER_TEMP "TimingShow-CI-$version"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Add-Type -AssemblyName System.IO.Compression

          $packages = @(
            @{
              Name = "TimingShow.UMM"
              Files = @(
                @{ Source = "TimingShow/bin/Release/TimingShow.dll"; Destination = "TimingShow.dll" },
                @{ Source = "TimingShow.Updater/bin/Release/TimingShow.Updater.dll"; Destination = "TimingShow.Updater.dll" },
                @{ Source = "TimingShow.Loader.UMM/bin/Release/TimingShow.Loader.UMM.dll"; Destination = "TimingShow.Loader.UMM.dll" },
                @{ Source = "TimingShow.Loader.UMM/bin/Release/Info.json"; Destination = "Info.json" },
                @{ Source = "TimingShow/bin/Release/lang.json"; Destination = "lang.json" }
              )
            },
            @{
              Name = "TimingShow.Melon"
              Files = @(
                @{ Source = "TimingShow/bin/Release/TimingShow.dll"; Destination = "Mods/TimingShow.dll" },
                @{ Source = "TimingShow.Updater/bin/Release/TimingShow.Updater.dll"; Destination = "Mods/TimingShow.Updater.dll" },
                @{ Source = "TimingShow.Loader.Melon/bin/Release/TimingShow.Loader.Melon.dll"; Destination = "Mods/TimingShow.Loader.Melon.dll" },
                @{ Source = "TimingShow/bin/Release/lang.json"; Destination = "Mods/lang.json" },
                @{ Source = "TimingShow.UpdateBootstrap/bin/Release/TimingShow.UpdateBootstrap.dll"; Destination = "Plugins/TimingShow.UpdateBootstrap.dll" }
              )
            }
          )

          foreach ($package in $packages) {
            $archivePath = Join-Path $dist "$($package.Name).zip"
            if (Test-Path $archivePath) {
              Remove-Item -LiteralPath $archivePath -Force
            }

            $archive = [System.IO.Compression.ZipFile]::Open($archivePath, "Create")
            try {
              foreach ($file in $package.Files) {
                if (-not (Test-Path $file.Source -PathType Leaf)) {
                  throw "Build output not found: $($file.Source)"
                }
                [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, (Resolve-Path $file.Source).ProviderPath, $file.Destination)
              }
            }
            finally {
              $archive.Dispose()
            }
          }

          $packagedInfo = Get-Content "TimingShow.Loader.UMM/bin/Release/Info.json" -Raw | ConvertFrom-Json
          if ($packagedInfo.Version -ne $version) {
            throw "Info.json version mismatch: $($packagedInfo.Version)"
          }

          "stage=$dist" >> $env:GITHUB_OUTPUT
          Get-ChildItem $dist | Select-Object Name, Length

      - name: Write preview repository manifest
        id: repository
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = "${{ steps.package.outputs.stage }}"

          $entries = @(
            [ordered]@{
              Id = "TimingShow"
              Version = $version
              GameVersion = "*"
              DownloadUrl = "https://github.com/$env:PREVIEW_REPOSITORY/releases/download/$version/TimingShow.UMM.zip"
              Changes = ""
              Sha256 = (Get-FileHash (Join-Path $stage "TimingShow.UMM.zip") -Algorithm SHA256).Hash
              Size = (Get-Item (Join-Path $stage "TimingShow.UMM.zip")).Length
            },
            [ordered]@{
              Id = "TimingShow.Melon"
              Version = $version
              GameVersion = "*"
              DownloadUrl = "https://github.com/$env:PREVIEW_REPOSITORY/releases/download/$version/TimingShow.Melon.zip"
              Changes = ""
              Sha256 = (Get-FileHash (Join-Path $stage "TimingShow.Melon.zip") -Algorithm SHA256).Hash
              Size = (Get-Item (Join-Path $stage "TimingShow.Melon.zip")).Length
            }
          )

          $manifest = [ordered]@{ Releases = $entries }
          $path = Join-Path $env:RUNNER_TEMP "Repository.json"
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path $path -Encoding utf8NoBOM
          "path=$path" >> $env:GITHUB_OUTPUT
          Get-Content $path

      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: TimingShow-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.stage }}/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview release
        if: ${{ inputs.branch == 'master' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.TS_CI }}
        run: |
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $tag = "${{ steps.version.outputs.version }}"
          $stage = "${{ steps.package.outputs.stage }}"
          $manifestPath = "${{ steps.repository.outputs.path }}"
          $notesPath = Join-Path $env:RUNNER_TEMP "preview-notes.md"

          $body = git log -1 --pretty=%B
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = "Preview build $tag"
          }
          Set-Content -Path $notesPath -Value $body -Encoding utf8NoBOM

          gh release delete $tag --repo $env:PREVIEW_REPOSITORY --cleanup-tag --yes 2>$null
          $LASTEXITCODE = 0

          gh release create $tag (Join-Path $stage "TimingShow.UMM.zip") (Join-Path $stage "TimingShow.Melon.zip") --repo $env:PREVIEW_REPOSITORY --title "Preview $tag" --prerelease --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) {
            gh release delete $tag --repo $env:PREVIEW_REPOSITORY --cleanup-tag --yes 2>$null
            throw "Failed to publish the preview release $tag."
          }

          $uri = "repos/$env:PREVIEW_REPOSITORY/contents/Repository.json"
          $sha = gh api $uri --jq .sha 2>$null
          if ($LASTEXITCODE -ne 0) {
            $sha = $null
          }

          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes((Get-Content $manifestPath -Raw)))
          $commitIdentity = @{ name = $env:PREVIEW_COMMIT_NAME; email = $env:PREVIEW_COMMIT_EMAIL }
          $payload = @{
            message   = "Update preview Repository.json to $tag"
            content   = $content
            branch    = $env:PREVIEW_BRANCH
            author    = $commitIdentity
            committer = $commitIdentity
          }
          if (-not [string]::IsNullOrWhiteSpace($sha)) {
            $payload["sha"] = $sha
          }
          $payloadPath = Join-Path $env:RUNNER_TEMP "repository-commit.json"
          $payload | ConvertTo-Json -Depth 5 | Set-Content -Path $payloadPath -Encoding utf8NoBOM

          gh api --method PUT $uri --input $payloadPath
          if ($LASTEXITCODE -ne 0) {
            gh release delete $tag --repo $env:PREVIEW_REPOSITORY --cleanup-tag --yes 2>$null
            throw "Failed to update Repository.json in $env:PREVIEW_REPOSITORY."
          }

          "### Preview $tag published" >> $env:GITHUB_STEP_SUMMARY
          "Repository: https://raw.githubusercontent.com/$env:PREVIEW_REPOSITORY/$env:PREVIEW_BRANCH/Repository.json" >> $env:GITHUB_STEP_SUMMARY
