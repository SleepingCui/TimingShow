name: Build Release

on:
  push:
    tags:
      - "*.*.*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout TimingShow
        uses: actions/checkout@v6

      - name: Checkout ADOFAI libs
        uses: actions/checkout@v6
        with:
          repository: SleepingCui/adofai-libs
          ref: main
          token: ${{ secrets.ADOFAI_LIBS_TOKEN }}
          path: libs

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: cmd
        run: build.bat

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path "TimingShow.zip")) {
            Write-Error "TimingShow.zip was not generated."
            exit 1
          }

          Write-Host "Package generated successfully:"
          Get-Item "TimingShow.zip" | Format-List Name, Length, FullName

      - name: Prepare release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $changelog = "CHANGELOG.md"

          if (-not (Test-Path $changelog)) {
            "body=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $content = Get-Content $changelog -Raw

          $pattern = "(?ms)^## \[?$([regex]::Escape($version))\]?(?:\s*-\s*[^\r\n]+)?\s*\r?\n(.*?)(?=^## |\z)"
          $match = [regex]::Match($content, $pattern)

          if ($match.Success) {
            $body = $match.Groups[1].Value.Trim()
          } else {
            Write-Warning "No changelog entry found for version $version."
            $body = ""
          }

          "body<<EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"

          gh release create "${{ github.ref_name }}" `
            "TimingShow.zip" `
            --draft `
            --title "TimingShow $version" `
            --notes "$env:RELEASE_BODY"