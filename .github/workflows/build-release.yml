name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout TimingShow
        uses: actions/checkout@v6

      - name: Checkout ADOFAI libs
        uses: actions/checkout@v6
        with:
          repository: SleepingCui/adofai-libs
          ref: main
          token: ${{ secrets.ADOFAI_LIBS_TOKEN }}
          path: libs

      - name: Inspect libs
        shell: pwsh
        run: |
          Write-Host "Current directory:"
          Get-Location

          Write-Host "`nlibs directory:"
          Get-ChildItem -Path libs -Recurse -File |
            Select-Object FullName, Length
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and package
        shell: cmd
        run: build.bat

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path "TimingShow.zip")) {
            Write-Error "TimingShow.zip was not generated."
            exit 1
          }

          Write-Host "Package generated successfully:"
          Get-Item "TimingShow.zip" | Format-List Name, Length, FullName

      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $changelog = "CHANGELOG.md"

          if (-not (Test-Path $changelog)) {
            Write-Error "CHANGELOG.md was not found."
            exit 1
          }

          $body = Get-Content $changelog -Raw

          "body<<EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

          Write-Host "CHANGELOG.md found."

      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          git tag "$env:TAG"
          git push origin "$env:TAG"

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
        shell: pwsh
        run: |
          gh release create "$env:TAG" `
            "TimingShow.zip" `
            --draft `
            --title "$env:TAG" `
            --notes "$env:RELEASE_BODY"

      - name: Update Repository.json
        env:
          TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $repoPath = "Repository.json"
          if (-not (Test-Path $repoPath)) {
            throw "Repository.json not found."
          }

          $json = Get-Content $repoPath -Raw | ConvertFrom-Json
          $entry = $json.Releases | Where-Object { $_.Id -eq "TimingShow" } | Select-Object -First 1
          if ($null -eq $entry) {
            throw "TimingShow entry not found in Repository.json."
          }

          $entry.Version = $env:TAG
          $entry.DownloadUrl = "https://github.com/$env:REPOSITORY/releases/download/$env:TAG/TimingShow.zip"
          $entry.Changes = ""

          $json | ConvertTo-Json -Depth 100 | Set-Content -Path $repoPath -Encoding utf8NoBOM

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $repoPath

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update Repository.json to $env:TAG"
            git push origin "HEAD:$env:BRANCH"
          } else {
            Write-Host "Repository.json is already up to date."
          }
