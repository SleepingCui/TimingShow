name: PR Check

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest

    steps:
      - name: Checkout TimingShow
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private libraries
        uses: actions/checkout@v4
        with:
          repository: SleepingCui/adofai-libs
          ref: main
          token: ${{ secrets.ADOFAI_LIBS_TOKEN }}
          path: libs
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        shell: pwsh
        run: msbuild TimingShow.slnx /m /p:Configuration=Release /p:Platform="Any CPU"

  geometry-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout TimingShow
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run geometry tests
        shell: pwsh
        run: dotnet run --project tools/GeometryTests/GeometryTests.csproj --configuration Release
